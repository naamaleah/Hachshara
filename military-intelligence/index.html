<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header class="header">
       <div class="header-logo">
        <img src="assets/shield.svg" alt="Shield logo">
       </div>
       <h1 class="header-title">SECRET OPS</h1>
       <div class="header-status">
        <span class="status-dot"></span>
        <span class="status-text">SECURE</span>
        <span class="status-separator">•</span>
        <span class="status-text">ONLINE</span>
       </div>
    </header>
    
    <main>
        <section class="radar-panel">
            <div class="radar">
                <div class="sweep"></div>
                <span class="radar-dot dot-1"></span>
                <span class="radar-dot dot-2"></span>
                <span class="radar-dot dot-3"></span>
            </div>

            <div class="radar-stats">
                <div class="stat">
                    <h2>24</h2>
                    <p>ACTIVE SIGNALS</p>
                </div>
                <div class="stat">
                    <h2>07</h2>
                    <p>POTENTIAL THREATS</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
