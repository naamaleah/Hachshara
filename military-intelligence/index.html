<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header class="header">
        <div class="header-logo">
            <img src="assets/shield.svg" alt="Shield logo">
        </div>
        <h1 class="header-title">SECRET OPS</h1>
        <div class="header-status">
            <span class="status-dot"></span>
            <span class="status-text">SECURE</span>
            <span class="status-separator">•</span>
            <span class="status-text">ONLINE</span>
        </div>
    </header>

    <main>
        <section class="radar-panel">
            <div class="radar">
                <div class="sweep"></div>
                <span class="radar-dot dot-1"></span>
                <span class="radar-dot dot-2"></span>
                <span class="radar-dot dot-3"></span>
            </div>

            <div class="radar-stats">
                <div class="stat">
                    <h2>24</h2>
                    <p>ACTIVE SIGNALS</p>
                </div>
                <div class="stat">
                    <h2>07</h2>
                    <p>POTENTIAL THREATS</p>
                </div>
            </div>
        </section>
        <section class="actions">
            <button class="action-button" type="button">
                <img src="assets/zap.svg" alt="">
                <span>New Brief</span>
            </button>
            <button class="action-button" type="button">
                <img src="assets/code.svg" alt="">
                <span>Decode</span>
            </button>
            <button class="action-button" type="button">
                <img src="assets/rocket.svg" alt="">
                <span>Request Drone</span>
            </button>
        </section>


        <section class="intelligence-grid">

            <article class="intel-card first">
                <div class="card-header">
                    <span class="card-badge">CRITICAL</span>
                    <span class="card-status">In Progress</span>
                </div>
                <h3>Operation Nightfall</h3>
                <div class="progress">
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                    <span>65%</span>
                </div>
            </article>

            <article class="intel-card seconed">
                <div class="card-header">
                    <span class="card-badge">HIGH</span>
                    <span class="card-status">Analyzing</span>
                </div>
                <h3>Signal Intercept Alpha</h3>
                <div class="progress">
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                    <span>40%</span>
                </div>
            </article>

            <article class="intel-card third">
                <div class="card-header">
                    <span class="card-badge">MEDIUM</span>
                    <span class="card-status">Pending</span>
                </div>
                <h3>Asset Recovery</h3>
                <div class="progress">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <span>15%</span>
                </div>
            </article>

            <article class="intel-card forth">
                <div class="card-header">
                    <span class="card-badge">HIGH</span>
                    <span class="card-status">Active</span>
                </div>
                <h3>Cyber Defense Grid</h3>
                <div class="progress">
                <div class="progress-track">
                    <div class="progress-fill"></div>

                </div>
                <span>80%</span>
                </div>
            </article>

        </section>


    </main>
</body>

</html>
