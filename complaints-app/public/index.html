<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to the IDF Anonymous Complaint System</h1>
    </header>
    <main class="container">
        <h2>Welcome to the IDF Anonymous Complaints System, a secure way for soldiers to share concerns anonymously.</h2>
        <button class="complaint">Send Complaints</button>

        <section class="admin-section">
            <label for="admin-password">Admin Password:</label>
            <input type="password" id="admin-password" name="admin-password">
            <button id="admin-login">Login</button>
        </section>
    </main>
</body>
</html>
